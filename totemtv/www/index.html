<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TotemTV</title>
  <style>
    * { -webkit-box-sizing:border-box; box-sizing:border-box; margin:0; padding:0; }
    body { background:#000; font-family:sans-serif; overflow:hidden; min-height:100vh; }
    @-webkit-keyframes spin { to { -webkit-transform:rotate(360deg); } }
    @keyframes spin { to { transform:rotate(360deg); } }

    #loading-screen {
      display:-webkit-box; display:-webkit-flex; display:flex; min-height:100vh;
      -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
      background:#0D0B08;
    }
    .spinner { width:60px; height:60px; border:4px solid #444; border-top-color:#C4A265;
      -webkit-border-radius:50%; border-radius:50%;
      -webkit-animation:spin 1s linear infinite; animation:spin 1s linear infinite; }
    #status-msg { margin-top:24px; color:#fff; font-size:26px; text-align:center; max-width:85vw; }
    #status-err { margin-top:16px; color:#E8A087; font-size:20px; text-align:center; max-width:85vw; display:none; }

    #slideshow-screen { display:none; position:fixed; top:0; right:0; bottom:0; left:0; background:#000; overflow:hidden; cursor:none; }
    .media-layer {
      position:absolute; top:0; right:0; bottom:0; left:0;
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; -webkit-align-items:center; align-items:center;
      -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
      opacity:0; -webkit-transition:opacity .6s ease-in-out; transition:opacity .6s ease-in-out; z-index:1;
    }
    .media-layer.active { opacity:1; z-index:2; }
    .media-layer img, .media-layer video { width:100%; height:100%; object-fit:contain; background:#000; }
    .video-wrapper { position:relative; width:100%; height:100%; }
    .video-wrapper video { width:100%; height:100%; object-fit:contain; }

    /* Buffering spinner — shows over the SLIDESHOW, on top of the still-visible previous item */
    #buffer {
      position:absolute; top:50%; left:50%;
      -webkit-transform:translate(-50%,-50%); transform:translate(-50%,-50%);
      z-index:20; display:none;
    }
    #buffer.on { display:block; }
    #buffer .spinner { width:50px; height:50px; border-width:4px; }

    #overlay {
      position:absolute; bottom:0; left:0; right:0; z-index:30;
      background:-webkit-linear-gradient(top,transparent,rgba(0,0,0,.8));
      background:linear-gradient(to bottom,transparent,rgba(0,0,0,.8));
      padding:60px 32px 24px; opacity:0; -webkit-transition:opacity .4s; transition:opacity .4s;
    }
    #slideshow-screen.show-ui #overlay { opacity:1; }
    .controls { display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; align-items:center; -webkit-box-pack:center; justify-content:center; margin-bottom:16px; }
    .ctrl-btn { background:rgba(255,255,255,.12); border:none; -webkit-border-radius:50%; border-radius:50%;
      width:56px; height:56px; margin:0 8px; cursor:pointer;
      display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-align:center; align-items:center; -webkit-box-pack:center; justify-content:center; }
    .info-bar { display:-webkit-box; display:-webkit-flex; display:flex;
      -webkit-box-pack:justify; justify-content:space-between; -webkit-box-align:center; align-items:center; direction:ltr; }
    #file-name { color:rgba(255,255,255,.6); font-size:16px; max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #counter   { color:rgba(255,255,255,.4); font-size:14px; }
    #dots { position:absolute; bottom:12px; left:50%; -webkit-transform:translateX(-50%); transform:translateX(-50%);
      display:-webkit-box; display:-webkit-flex; display:flex; opacity:0; z-index:30; -webkit-transition:opacity .4s; transition:opacity .4s; }
    #slideshow-screen.show-ui #dots { opacity:1; }
    .dot { height:6px; width:6px; margin:0 2px; -webkit-border-radius:3px; border-radius:3px;
      background:rgba(255,255,255,.35); -webkit-transition:all .3s; transition:all .3s; }
    .dot.active { background:#fff; width:18px; }

    #debug { position:fixed; top:0; left:0; right:0; max-height:40vh; overflow:hidden;
      background:rgba(0,0,0,.75); color:#7fff7f; font-family:monospace; font-size:14px;
      padding:6px 10px; z-index:9999; pointer-events:none; direction:ltr; text-align:left; white-space:pre-wrap;
      display:none; }
    #debug.on { display:block; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <p id="status-msg">Starting...</p>
    <p id="status-err"></p>
  </div>

  <div id="slideshow-screen">
    <object id="av-player" type="application/avplayer" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;"></object>
    <div id="layer-a" class="media-layer active"></div>
    <div id="layer-b" class="media-layer"></div>
    <div id="buffer"><div class="spinner"></div></div>
    <div id="overlay">
      <div class="controls">
        <button class="ctrl-btn" id="prev-btn"><svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
        <button class="ctrl-btn" id="pause-btn"><svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
        <button class="ctrl-btn" id="next-btn"><svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
      </div>
      <div class="info-bar"><span id="file-name"></span><span id="counter"></span></div>
    </div>
    <div id="dots"></div>
  </div>
  <div id="debug"></div>

  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script>
    // ===== on-screen + remote debug logger =====
    var DEBUG_ON = false; // press '0' on the remote to toggle
    // Optional LAN log server (dev only). Leave '' in production so the app
    // never depends on the dev machine being on.
    var REMOTE_LOG_URL = '';
    var __dbg = document.getElementById('debug');
    var __dbgLines = [];
    function __remote(msg){
      if(!REMOTE_LOG_URL) return;
      try{
        var x=new XMLHttpRequest(); x.open('POST',REMOTE_LOG_URL,true);
        x.setRequestHeader('Content-Type','text/plain');
        x.send(msg);
      }catch(e){}
    }
    function dbg(msg){
      try {
        var t = new Date(); var pad = function(n){return n<10?'0'+n:n;};
        var s = pad(t.getHours())+':'+pad(t.getMinutes())+':'+pad(t.getSeconds())+'.'+(t.getMilliseconds()+'').substr(0,2)+' '+msg;
        __dbgLines.push(s); if(__dbgLines.length>18)__dbgLines.shift();
        if(__dbg){__dbg.textContent = __dbgLines.join('\n'); __dbg.className = DEBUG_ON ? 'on' : '';}
        __remote(s);
      } catch(e){}
    }
    function toggleDebug(){ DEBUG_ON = !DEBUG_ON; if(__dbg) __dbg.className = DEBUG_ON ? 'on' : ''; }
    window.onerror = function(m,src,l,c,e){ dbg('JSERR: '+m+' @'+(src||'')+':'+l); };
  </script>
  <script>
    var API_KEY   = 'AIzaSyCfimRAzTq-1jm0v0T7UxaQ9tD3VHe1DgQ';
    var FOLDER_ID = '16avbuT7FPkikcxX4_oX3_tw-Fyl50y64';
    var PHOTO_DURATION   = 8000;
    var REFRESH_INTERVAL = 2 * 60 * 1000;
    var VIDEO_READY_TIMEOUT = 25000; // max wait for a video to start before skipping
    var IMAGE_TYPES = ['image/jpeg','image/png','image/gif','image/webp','image/bmp'];
    var VIDEO_TYPES = ['video/mp4','video/webm','video/quicktime','video/x-msvideo','video/3gpp'];

    var files=[], playlist=[], currentIndex=0, isPaused=false;
    var advanceTimer=null, isTransitioning=false, mediaGen=0, lastAdvance=Date.now();

    var loadingScreen   = document.getElementById('loading-screen');
    var slideshowScreen = document.getElementById('slideshow-screen');
    var layerA=document.getElementById('layer-a'), layerB=document.getElementById('layer-b');
    var currentLayer=layerA, nextLayer=layerB;
    var bufferEl = document.getElementById('buffer');
    var statusMsg = document.getElementById('status-msg');
    var statusErr = document.getElementById('status-err');
    var fileNameEl= document.getElementById('file-name');
    var counterEl = document.getElementById('counter');
    var dotsEl    = document.getElementById('dots');
    var pauseBtn  = document.getElementById('pause-btn');

    function isVid(f){if(!f)return false;for(var i=0;i<VIDEO_TYPES.length;i++)if(f.mimeType&&f.mimeType.indexOf(VIDEO_TYPES[i].split('/')[0])===0)return true;return false;}
    // Videos are proxied (Tizen 3.0 AVPlay can't handshake with modern HTTPS / googleapis.com).
    // PRODUCTION: the Cloudflare Worker URL, e.g. 'https://totemtv-drive-proxy.<subdomain>.workers.dev/drive/'
    // DEV: the LAN helper, e.g. 'http://10.0.0.54:8765/drive/'
    var VIDEO_PROXY_BASE = 'https://REPLACE_WITH_WORKER_SUBDOMAIN.workers.dev/drive/';
    function videoUrl(f){return VIDEO_PROXY_BASE + f.id;}
    function imageUrl(f){return 'https://lh3.googleusercontent.com/d/'+f.id+'=w1920-h1080-rj';}

    // Optional AVPlay self-test URL (dev only). Empty disables it.
    var AV_TEST_URL = '';
    var AV_TEST_DONE = true; // self-test disabled in production

    function buildPlaylist(list){
      var imgs=[],vids=[];
      for(var i=0;i<list.length;i++)(isVid(list[i])?vids:imgs).push(list[i]);
      if(!imgs.length||!vids.length)return list.slice();
      var r=[],n=Math.max(imgs.length,vids.length);
      for(var j=0;j<n;j++){r.push(imgs[j%imgs.length]);r.push(vids[j%vids.length]);}
      return r;
    }
    function updateDots(){
      dotsEl.innerHTML='';
      if(playlist.length>30||playlist.length<=1)return;
      for(var i=0;i<playlist.length;i++){var d=document.createElement('div');d.className='dot'+(i===currentIndex?' active':'');dotsEl.appendChild(d);}
    }
    function showBuffer(on){ bufferEl.className=on?'on':''; }

    function xhrGet(url){
      return new Promise(function(resolve,reject){
        var xhr=new XMLHttpRequest();xhr.open('GET',url,true);xhr.timeout=30000;
        xhr.onload=function(){xhr.status<300?resolve(xhr.responseText):reject(new Error('HTTP '+xhr.status));};
        xhr.onerror=function(){reject(new Error('Network error'));};
        xhr.ontimeout=function(){reject(new Error('Timeout'));};
        xhr.send();
      });
    }
    function fetchFiles(){
      var url='https://www.googleapis.com/drive/v3/files'+
        '?q='+encodeURIComponent("'"+FOLDER_ID+"' in parents and trashed = false")+
        '&fields='+encodeURIComponent('files(id,name,mimeType,videoMediaMetadata,size)')+
        '&orderBy=createdTime+desc&pageSize=1000&key='+API_KEY;
      return xhrGet(url).then(function(t){
        var data=JSON.parse(t),result=[],all=data.files||[];
        for(var i=0;i<all.length;i++){
          var f=all[i],ok=IMAGE_TYPES.indexOf(f.mimeType)>=0;
          if(!ok)for(var j=0;j<VIDEO_TYPES.length;j++)if(f.mimeType&&f.mimeType.indexOf(VIDEO_TYPES[j].split('/')[0])===0){ok=true;break;}
          if(ok)result.push(f);
        }
        return result;
      });
    }

    function scheduleAdvance(ms){clearTimeout(advanceTimer);if(!isPaused)advanceTimer=setTimeout(goNext,ms);}

    // ===== Samsung AVPlay (native) video player =====
    var avEl = document.getElementById('av-player');
    var avBusy = false;
    function avAvailable(){ return typeof webapis !== 'undefined' && webapis && webapis.avplay; }
    function avStop(){
      if(!avAvailable())return;
      try { webapis.avplay.stop(); } catch(e){}
      try { webapis.avplay.close(); } catch(e){}
      if(avEl) avEl.style.display='none';
      avBusy = false;
    }
    function avPlay(url, gen, onReady, onEnd, onError){
      if(!avAvailable()){ onError && onError('no avplay'); return; }
      try {
        dbg('AV avStop()');
        avStop();
        avEl.style.display='block';
        dbg('AV open');
        webapis.avplay.open(url);
        dbg('AV state after open='+webapis.avplay.getState());
        var w = window.innerWidth || 1920, h = window.innerHeight || 1080;
        try { webapis.avplay.setDisplayRect(0,0,w,h); dbg('AV setDisplayRect '+w+'x'+h); } catch(e){ dbg('AV setDisplayRect err '+e.message); }
        try { webapis.avplay.setDisplayMethod('PLAYER_DISPLAY_MODE_LETTER_BOX'); } catch(e){ dbg('AV setDisplayMethod err '+e.message); }
        var notified = false;
        try {
          webapis.avplay.setListener({
            onbufferingstart: function(){ dbg('AV buffering start'); },
            onbufferingprogress: function(p){ /* dbg('AV buf '+p+'%'); */ },
            onbufferingcomplete: function(){ dbg('AV buf complete'); if(gen===mediaGen && !notified){ notified=true; onReady && onReady(); } },
            oncurrentplaytime: function(t){},
            onstreamcompleted: function(){ dbg('AV stream completed'); if(gen===mediaGen) onEnd && onEnd(); },
            onevent: function(et,ed){ dbg('AV event '+et+' '+ed); },
            onerror: function(e){ dbg('AV error '+e); if(gen===mediaGen) onError && onError(e); },
            onerrormsg: function(e,m){ dbg('AV errormsg '+e+' '+m); },
            onsubtitlechange: function(){},
            ondrmevent: function(){}
          });
          dbg('AV listener set');
        } catch(e){ dbg('AV setListener ex '+e.message); }
        dbg('AV prepareAsync()');
        webapis.avplay.prepareAsync(function(){
          dbg('AV prepared, state='+webapis.avplay.getState());
          try { webapis.avplay.play(); dbg('AV play() called, state='+webapis.avplay.getState()); } catch(e){ dbg('AV play err '+e.message); onError && onError(e.message); return; }
          if(!notified){ notified=true; onReady && onReady(); }
        }, function(e){
          dbg('AV prepareAsync failed: '+JSON.stringify(e));
          if(gen===mediaGen) onError && onError(e);
        });
        dbg('AV prepareAsync returned');
      } catch(e){
        dbg('AV exception '+e.message+' '+e.name);
        onError && onError(e.message);
      }
    }

    // Swap layers: next becomes visible, old fades out.
    function crossFade(){
      showBuffer(false);
      currentLayer.className='media-layer';
      nextLayer.className='media-layer active';
      var old=currentLayer; currentLayer=nextLayer; nextLayer=old;
      setTimeout(function(){
        var v=old.querySelectorAll('video');
        for(var i=0;i<v.length;i++){try{v[i].pause();v[i].src='';v[i].load();}catch(e){}}
        old.innerHTML='';
        lastAdvance=Date.now();
      },700);
      isTransitioning=false;
    }

    // For AVPlay-backed videos: hide both layers (so the native player surface shows through)
    function hideHtmlLayers(){
      showBuffer(false);
      layerA.className='media-layer';
      layerB.className='media-layer';
      lastAdvance = Date.now();
      isTransitioning = false;
    }

    function goNext(){clearTimeout(advanceTimer);mediaGen++;isTransitioning=false;if(!playlist.length)return;currentIndex=(currentIndex+1)%playlist.length;showMedia();}
    function goPrev(){clearTimeout(advanceTimer);mediaGen++;isTransitioning=false;if(!playlist.length)return;currentIndex=(currentIndex-1+playlist.length)%playlist.length;showMedia();}

    function showMedia(){
      if(!playlist.length||isTransitioning)return;
      isTransitioning=true;
      var gen=mediaGen, file=playlist[currentIndex];
      if(!file){currentIndex=0;isTransitioning=false;showMedia();return;}

      fileNameEl.textContent=file.name;
      counterEl.textContent=(currentIndex+1)+' / '+playlist.length;
      updateDots();

      // Pause any video in the (still-visible) current layer's siblings, but keep it shown
      nextLayer.innerHTML='';
      showBuffer(true); // show spinner over the still-visible previous item while next loads

      if(isVid(file)){
        dbg('VID start: '+file.name+' ('+(file.size||'?')+'B) avplay='+avAvailable());

        // ---------- preferred: native AVPlay ----------
        if(avAvailable()){
          var avDone=false, avTimer=null;
          function avReady(){
            if(gen!==mediaGen||avDone)return;
            avDone=true; clearTimeout(avTimer);
            dbg('AV ready -> show');
            hideHtmlLayers();           // reveal native player surface
            // Prefer the player-reported duration (accurate after prepare)
            var dur = 0;
            try { dur = webapis.avplay.getDuration(); } catch(e){}
            if(!(dur>0) && file.videoMediaMetadata && file.videoMediaMetadata.durationMillis)
              dur = parseInt(file.videoMediaMetadata.durationMillis,10);
            if(!(dur>0)) dur = 60000;
            dur += 2000; // small grace; onstreamcompleted will fire sooner anyway
            dbg('AV scheduled advance in '+dur+'ms');
            scheduleAdvance(dur);
          }
          function avEnd(){ if(gen===mediaGen) goNext(); }
          function avFail(why){
            if(gen!==mediaGen)return;
            dbg('AV fail '+why+' -> next');
            clearTimeout(avTimer); avDone=true;
            avStop();
            showBuffer(false); isTransitioning=false;
            setTimeout(function(){if(gen===mediaGen)goNext();},300);
          }
          avTimer = setTimeout(function(){avFail('timeout');}, VIDEO_READY_TIMEOUT);
          // First video: run a self-test against a known-good HTTP MP4
          var useUrl = videoUrl(file);
          if(!AV_TEST_DONE){
            AV_TEST_DONE = true;
            dbg('AV SELF-TEST with HTTP url');
            useUrl = AV_TEST_URL;
          }
          avPlay(useUrl, gen, avReady, avEnd, avFail);
          return;
        }

        // ---------- fallback: HTML5 <video> ----------
        var wrap=document.createElement('div');wrap.className='video-wrapper';
        var vid=document.createElement('video');
        vid.muted=true;
        vid.setAttribute('muted','');
        vid.setAttribute('autoplay','');
        vid.setAttribute('preload','auto');
        vid.setAttribute('playsinline','');
        var shown=false, timer=null;

        function ready(why){
          if(gen!==mediaGen||shown)return;
          dbg('VID ready ('+why+') rs='+vid.readyState+' ns='+vid.networkState);
          shown=true; clearTimeout(timer);
          crossFade();
          var p=vid.play();
          if(p&&p.catch)p.catch(function(e){dbg('play() rejected: '+(e&&e.message||e));});
          setTimeout(function(){try{vid.muted=false;}catch(e){}},400);
          var dur=60000;
          if(file.videoMediaMetadata&&file.videoMediaMetadata.durationMillis)
            dur=parseInt(file.videoMediaMetadata.durationMillis,10)+2000;
          scheduleAdvance(dur);
        }
        function fail(why){
          if(gen!==mediaGen)return;
          var err=vid.error?('code='+vid.error.code+' msg='+(vid.error.message||'')):'';
          dbg('VID fail ('+why+') rs='+vid.readyState+' ns='+vid.networkState+' '+err);
          clearTimeout(timer); shown=true;
          showBuffer(false);
          isTransitioning=false;
          setTimeout(function(){if(gen===mediaGen)goNext();},300);
        }

        vid.addEventListener('loadstart',function(){dbg('VID loadstart');});
        vid.addEventListener('loadedmetadata',function(){dbg('VID loadedmetadata '+vid.videoWidth+'x'+vid.videoHeight+' dur='+vid.duration);});
        vid.addEventListener('loadeddata',function(){ready('loadeddata');});
        vid.addEventListener('canplay',function(){ready('canplay');});
        vid.addEventListener('canplaythrough',function(){ready('canplaythrough');});
        vid.addEventListener('playing',function(){ready('playing');});
        vid.addEventListener('stalled',function(){dbg('VID stalled rs='+vid.readyState+' ns='+vid.networkState);});
        vid.addEventListener('suspend',function(){dbg('VID suspend');});
        vid.addEventListener('waiting',function(){dbg('VID waiting');});
        vid.addEventListener('ended',function(){dbg('VID ended');if(gen===mediaGen)goNext();});
        vid.addEventListener('error',function(){fail('error event');});
        timer=setTimeout(function(){fail('timeout');},VIDEO_READY_TIMEOUT);

        wrap.appendChild(vid); nextLayer.appendChild(wrap);
        vid.src=videoUrl(file);
        dbg('VID src set');
        vid.load();

      } else {
        // image branch — stop any native video first
        avStop();
        var img=document.createElement('img'); img.alt=file.name;
        var shownI=false, timerI=null;
        function readyI(){
          if(gen!==mediaGen||shownI)return;
          shownI=true; clearTimeout(timerI);
          crossFade();
          scheduleAdvance(PHOTO_DURATION);
        }
        function failI(){
          if(gen!==mediaGen)return;
          clearTimeout(timerI); shownI=true; showBuffer(false); isTransitioning=false;
          setTimeout(function(){if(gen===mediaGen)goNext();},300);
        }
        img.addEventListener('load',readyI);
        img.addEventListener('error',failI);
        timerI=setTimeout(failI,15000);
        nextLayer.appendChild(img);
        img.src=imageUrl(file);
        if(img.complete&&img.naturalWidth>0)readyI();
      }
    }

    function togglePause(){
      isPaused=!isPaused;
      if(isPaused){
        pauseBtn.innerHTML='<svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>';
        clearTimeout(advanceTimer);
        if(avAvailable()){ try { webapis.avplay.pause(); } catch(e){} }
        var v=currentLayer.querySelector('video');if(v)try{v.pause();}catch(e){}
      } else {
        pauseBtn.innerHTML='<svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
        if(avAvailable()){
          try { var st = webapis.avplay.getState(); if(st==='PAUSED'){ webapis.avplay.play(); return; } } catch(e){}
        }
        var v2=currentLayer.querySelector('video');if(v2){try{v2.play();}catch(e){}}
        else scheduleAdvance(PHOTO_DURATION);
      }
    }

    // Watchdog: if nothing advanced for a while, force next
    setInterval(function(){
      if(slideshowScreen.style.display!=='block'||isPaused)return;
      if(Date.now()-lastAdvance>180000){mediaGen++;isTransitioning=false;clearTimeout(advanceTimer);goNext();}
    },20000);

    var hideUITimer=null;
    function showUI(){slideshowScreen.className='show-ui';clearTimeout(hideUITimer);hideUITimer=setTimeout(function(){slideshowScreen.className='';},4000);}

    function launch(){
      dbg('launch() UA='+(navigator.userAgent||'').substr(0,60));
      statusMsg.textContent='מתחבר ל-Google Drive...';
      fetchFiles().then(function(result){
        if(!result.length)throw new Error('לא נמצאו קבצים בתיקייה');
        dbg('fetched '+result.length+' files');
        files=result; playlist=buildPlaylist(files);
        loadingScreen.style.display='none';
        slideshowScreen.style.display='block';
        lastAdvance=Date.now(); currentIndex=0; showMedia();

        setInterval(function(){
          fetchFiles().then(function(nf){
            if(!nf.length)return;
            var curId=playlist[currentIndex]?playlist[currentIndex].id:null;
            files=nf; playlist=buildPlaylist(files);
            var ni=0;for(var i=0;i<playlist.length;i++)if(playlist[i].id===curId){ni=i;break;}
            currentIndex=ni; updateDots();
          }).catch(function(){});
        },REFRESH_INTERVAL);
      }).catch(function(err){
        statusMsg.textContent='שגיאה';
        statusErr.textContent=err?err.message:'Unknown error';
        statusErr.style.display='block';
      });
    }

    document.getElementById('prev-btn').addEventListener('click',function(e){e.stopPropagation();goPrev();showUI();});
    document.getElementById('next-btn').addEventListener('click',function(e){e.stopPropagation();goNext();showUI();});
    document.getElementById('pause-btn').addEventListener('click',function(e){e.stopPropagation();togglePause();showUI();});
    slideshowScreen.addEventListener('click',showUI);
    document.addEventListener('keydown',function(e){
      if(e.key==='0' || e.keyCode===48){ toggleDebug(); return; }
      if(slideshowScreen.style.display==='block'){
        if(e.key==='ArrowRight'||e.key==='ArrowDown')goNext();
        else if(e.key==='ArrowLeft'||e.key==='ArrowUp')goPrev();
        else if(e.key===' '||e.key==='Enter')togglePause();
        showUI();
      }
    });

    launch();
  </script>
</body>
</html>
