name: Re-skin All Videos

# Re-renders every "done" video from its original raw with the CURRENT overlay
# design (white top-right logo + taller banner) and replaces the edited output
# in place. Use dry_run first to see how many videos are targeted and whether
# their raw originals still exist.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only count targets + check raw availability (no replace)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Re-skin all videos
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python .github/scripts/redesign_all.py --dry-run
          else
            python .github/scripts/redesign_all.py
          fi
